<!doctype html>
<!--
  agentic-report-creator — English report skeleton (the root index.html).
  The invoking skill substitutes the double-brace slots (listed below) and writes to
  docs/reports/<slug>/index.html. UI chrome below is English; the Russian sibling
  lives in ru/index.html, rendered from templates/ru-shell.html.

  Slots:
    {{LANG}}         html lang ("en")
    {{TITLE}}        report title (also used in <title>)
    {{SUBTITLE}}     one-line subtitle
    {{DATE}}         report date, e.g. 2026-07-15
    {{EPIC}}         Jira epic key, e.g. TLM-360 (or "")
    {{ASSETS_PATH}}  relative asset prefix — "assets/" at root, "../assets/" under ru/
    {{SUMMARY_HTML}} executive-summary block (hero + counts) — see SKILL.md
    {{FINDINGS_HTML}}rendered findings list
    {{ARCHITECTURE_HTML}} optional architecture-notes block (or "")
    {{AUDITOR}}      who/what produced the report
    {{SHIPPED_AT}}   commit / build under audit (or "")
    {{GENERATED_AT}} generation timestamp

  Assets: this template LINKS the shared CSS/JS by relative path. To make a single
  self-contained file instead, replace the <link>/<script src> tags with inline
  <style>…</style> / <script>…</script> holding the file contents. Both work.
-->
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="{{ASSETS_PATH}}styles.css">
  <script>
    /* Set theme before first paint to avoid a flash of the wrong theme,
       then wire the toggle once the DOM is ready. No external dependency. */
    (function () {
      try {
        var saved = localStorage.getItem("arc-theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
      document.addEventListener("DOMContentLoaded", function () {
        var btn = document.querySelector(".theme-toggle");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var root = document.documentElement;
          var isDark = root.getAttribute("data-theme")
            ? root.getAttribute("data-theme") === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          var next = isDark ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("arc-theme", next); } catch (e) {}
        });
      });
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <span class="title">{{TITLE}}</span>
        <span class="subtitle">{{SUBTITLE}}</span>
      </div>
      <div class="header-meta">
        <span class="hbtn" aria-label="Epic">{{EPIC}}</span>
        <span class="hbtn" aria-label="Date">{{DATE}}</span>
        <!-- Language switch: English root -> Russian sibling -->
        <a class="hbtn lang-switch" href="ru/index.html" hreflang="ru">EN <span aria-hidden="true">⇄</span> RU</a>
        <button class="hbtn theme-toggle" type="button" aria-label="Toggle color theme">
          <svg class="icon to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon to-light" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span>Theme</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Executive summary -->
    <section aria-labelledby="sum-h">
      <h2 class="section-title" id="sum-h">Executive summary</h2>
      {{SUMMARY_HTML}}
    </section>

    <!-- Findings -->
    <section aria-labelledby="find-h">
      <h2 class="section-title" id="find-h">Findings</h2>
      <div class="findings">
        {{FINDINGS_HTML}}
      </div>
    </section>

    <!-- Architecture notes (optional; renders nothing if the slot is empty) -->
    {{ARCHITECTURE_HTML}}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>Generated by <strong>{{AUDITOR}}</strong> · {{GENERATED_AT}}</span>
      <span>Audited build <code>{{SHIPPED_AT}}</code></span>
    </div>
  </footer>

  <script src="{{ASSETS_PATH}}lightbox.js" defer></script>
</body>
</html>
